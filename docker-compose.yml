services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: studyflow:latest
    container_name: studyflow-web
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
